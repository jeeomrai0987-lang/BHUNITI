[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

# test_api.py is the only in-process suite: it drives the ASGI app directly and
# needs nothing running. The other three test_*.py files at the repository root
# are live smoke scripts -- they expect uvicorn on :8000, Vite on :5173 and
# real Supabase credentials, so a plain `pytest` used to fail on connection
# errors (or hang) before it reached anything meaningful. They are excluded from
# collection and run directly instead:
#
#     python test_e2e_live.py          # full stack, backend + frontend up
#     python test_2nd_db.py            # Supabase connectivity, reads .env
#     python test_ulpin_gis_search.py  # ULPIN/GIS search against a live API
#     python verify_live_api.py        # in-process API walkthrough, no server
addopts =
    --ignore=test_e2e_live.py
    --ignore=test_2nd_db.py
    --ignore=test_ulpin_gis_search.py
